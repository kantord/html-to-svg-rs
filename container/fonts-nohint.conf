<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The fonts setup of the Chrome whose pages html-to-svg is compared against in the WPT runner
     (FONTCONFIG_FILE, see packages/wpt-runner): unhinted, greyscale glyphs, the closest Chrome's
     text gets to the glyph outlines our SVG draws. Measured on 20 WPT pages with text: 15% fewer
     differing pixels inside text boxes than WPT's own Chrome flags. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
