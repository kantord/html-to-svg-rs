# The npm package html-to-svg-rs (packages/html-to-svg-rs): the Node.js addon built for every
# platform it supports, tested on each operating system, and published on a `v*` tag.
#
# Publishing runs in the GitHub environment `npm` (give it required reviewers to approve each
# release) and needs its secret NPM_TOKEN (an npm automation token). The tag's version must be the
# one in packages/html-to-svg-rs/package.json (`pnpm version <x.y.z>` there sets it in the
# platform packages too).
#
# Nothing here uses a cache: a build that is published must not take anything from a cache another
# run (a pull request) could have written. Same hardening as ci.yml otherwise.
name: npm package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.17 toolchain: the addon loads on old distributions too.
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-24.04, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          # musl (Alpine) through zig.
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-musl, flags: --cross-compile, zig: true }
          - { host: ubuntu-24.04, target: aarch64-unknown-linux-musl, flags: --cross-compile, zig: true }
          - { host: macos-15, target: x86_64-apple-darwin }
          - { host: macos-15, target: aarch64-apple-darwin }
          - { host: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, with the target added.
      - run: rustup toolchain install && rustup target add "$TARGET"
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
          use-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # On by default when package.json names a package manager: off here (see the top).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: build
        working-directory: packages/html-to-svg-rs
        # FLAGS is a list of flags: split on purpose.
        # shellcheck disable=SC2086
        run: pnpm build --target "$TARGET" $FLAGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: packages/html-to-svg-rs/*.node
          if-no-files-found: error

  test:
    name: test ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-15, target: aarch64-apple-darwin }
          - { host: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # On by default when package.json names a package manager: off here (see the top).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: packages/html-to-svg-rs
      - name: test
        working-directory: packages/html-to-svg-rs
        run: pnpm test

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # npm provenance: the package says which workflow run built it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # On by default when package.json names a package manager: off here (see the top).
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindings-*
          path: packages/html-to-svg-rs/artifacts
      - name: check the tag is the package's version
        working-directory: packages/html-to-svg-rs
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: platform packages
        working-directory: packages/html-to-svg-rs
        run: |
          pnpm create-npm-dirs
          pnpm artifacts
          ls -R npm
      - name: publish
        working-directory: packages/html-to-svg-rs
        # prepublishOnly (napi prepublish) publishes each platform package first and adds them to
        # this package's optionalDependencies.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
