# The npm package html-to-svg-rs (packages/html-to-svg-rs): the Node.js addon built for every
# platform it supports, tested on each operating system, and published on a `v*` tag.
#
# Publishing needs the repository secret NPM_TOKEN (an npm automation token). The tag's version
# must be the one in packages/html-to-svg-rs/package.json (`pnpm version <x.y.z>` there sets it in
# the platform packages too).
name: npm package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.17 toolchain: the addon loads on old distributions too.
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          # musl (Alpine) through zig.
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: --cross-compile, zig: true }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: --cross-compile, zig: true }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The toolchain rust-toolchain.toml pins, with the target added.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: build
        working-directory: packages/html-to-svg-rs
        run: pnpm build --target ${{ matrix.target }} ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/html-to-svg-rs/*.node
          if-no-files-found: error

  test:
    name: test ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/html-to-svg-rs
      - name: test
        working-directory: packages/html-to-svg-rs
        run: pnpm test

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: packages/html-to-svg-rs/artifacts
      - name: check the tag is the package's version
        working-directory: packages/html-to-svg-rs
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: platform packages
        working-directory: packages/html-to-svg-rs
        run: |
          pnpm create-npm-dirs
          pnpm artifacts
          ls -R npm
      - name: publish
        working-directory: packages/html-to-svg-rs
        # prepublishOnly (napi prepublish) publishes each platform package first and adds them to
        # this package's optionalDependencies.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
