<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>playwright-html-to-svg-rs test page</title>
<style>
  body { margin: 0; padding: 24px; font: 15px/1.4 sans-serif; color: #1f2933; background: #f4f6f8; }
  .row { display: flex; gap: 16px; }
  .card { flex: 1; padding: 16px; border-radius: 12px; background: white;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); border: 1px solid #d9e2ec; }
  .card h2 { margin: 0 0 8px; font-size: 20px; }
  .hero { height: 90px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #a855f7); }
  .dots { height: 60px; margin-top: 12px; background: url("/dots.svg") 0 0 / 20px 20px repeat; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  td, th { border-bottom: 1px solid #d9e2ec; padding: 4px 8px; text-align: left; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #fde68a;
           transform: rotate(-6deg); font-weight: bold; }
</style>
</head>
<body>
  <div class="row">
    <section class="card" data-testid="summary">
      <h2>Weekly summary</h2>
      <div class="hero"></div>
      <p>Revenue rose by <strong>12.4%</strong> compared with last week, while costs stayed flat.</p>
      <span class="badge" data-testid="badge">New</span>
    </section>
    <section class="card" data-testid="regions">
      <h2>Regions</h2>
      <table>
        <tr><th>Region</th><th>Orders</th></tr>
        <tr data-testid="row-eu"><td>Europe</td><td>1,204</td></tr>
        <tr><td>Americas</td><td>987</td></tr>
        <tr><td>Asia</td><td>1,530</td></tr>
      </table>
      <div class="dots" data-testid="dots"></div>
    </section>
  </div>
</body>
</html>
