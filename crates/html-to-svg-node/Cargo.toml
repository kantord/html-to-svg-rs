[package]
name = "html-to-svg-node"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Node.js bindings of html-to-svg-rs (the npm package html-to-svg-rs, packages/html-to-svg-rs)"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "=1.0.104"
# The conversion only: no Chrome-driving capture (chromiumoxide, tokio) in the addon.
html-to-svg-rs = { path = "../html-to-svg-rs", default-features = false }
napi = { version = "=3.15.0", default-features = false, features = ["napi6"] }
napi-derive = "=3.6.13"

[build-dependencies]
napi-build = "=2.6.0"
