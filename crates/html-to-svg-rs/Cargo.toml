[package]
name = "html-to-svg-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
takumi = { version = "2.19.0", default-features = false, features = ["raster-backend", "svg-backend", "svg-source", "image-decoding", "woff2", "woff"] }
chromiumoxide = { version = "0.9.1", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
resvg = "0.45"
base64 = "0.22"
# The WOFF/WOFF2 decoder Takumi itself uses, to read web fonts' PostScript names.
wuff = { version = "0.2", default-features = false, features = ["brotli", "z"] }
ttf-parser = "0.25"
sha2 = "0.10"
