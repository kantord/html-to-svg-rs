[package]
name = "html-to-svg-rs"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[features]
# `capture::capture`, which drives Chrome. The conversion needs none of it: the Node.js bindings
# (crates/html-to-svg-node) build without it.
default = ["capture"]
capture = ["dep:chromiumoxide", "dep:tokio", "dep:futures"]

[dependencies]
takumi = { version = "2.19.0", default-features = false, features = ["raster-backend", "svg-backend", "svg-source", "image-decoding", "woff2", "woff"] }
# The capture (driving Chrome): only with the `capture` feature.
chromiumoxide = { version = "0.9.1", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
futures = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
resvg = "0.45"
base64 = "0.22"
# The WOFF/WOFF2 decoder Takumi itself uses, to read web fonts' PostScript names.
wuff = { version = "0.2", default-features = false, features = ["brotli", "z"] }
ttf-parser = "0.25"
sha2 = "0.10"
