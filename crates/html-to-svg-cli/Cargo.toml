[package]
name = "html-to-svg-cli"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[[bin]]
name = "html-to-svg"
path = "src/main.rs"

[dependencies]
html-to-svg-rs = { path = "../html-to-svg-rs" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
anyhow = "=1.0.104"
serde_json = "=1.0.154"
resvg = "=0.49.0"
