packages:
  - "packages/*"

# Supply-chain hardening, as in enwiro: refuse to install any package version (transitive ones
# too) published less than 3 days ago. The same age as renovate.json's minimumReleaseAge and
# scripts/release-age.py's for Cargo.lock: every dependency of the repository is at least 3 days
# old. An exception is an exact version in minimumReleaseAgeExclude, with a comment saying why.
minimumReleaseAge: 4320

# One version of each tool shared by the packages: they refer to it as `"catalog:"`.
catalog:
  "@napi-rs/cli": 3.10.9
  "@playwright/test": 1.64.1
  "@types/node": 26.6.6
  "@types/pngjs": 6.0.5
  pixelmatch: 8.0.0
  pngjs: 7.0.0
  typescript: 7.0.2
  vite: 8.3.5
